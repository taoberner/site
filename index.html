<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculateur de trajet liO</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      margin: 0;
      padding: 40px;
    }

    h1 {
      font-size: 56px;
      margin-bottom: 40px;
    }

    .search-bar {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    input {
      flex: 1;
      min-width: 260px;
      padding: 20px;
      font-size: 20px;
      border: 1px solid #bbb;
      border-radius: 14px;
    }

    button {
      padding: 20px 34px;
      font-size: 20px;
      border: none;
      border-radius: 14px;
      background: #3f6edb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #2f58b8;
    }

    #status {
      margin-bottom: 20px;
      font-size: 18px;
      color: #555;
    }

    #result {
      margin-top: 20px;
      padding: 30px;
      background: white;
      border-radius: 18px;
      min-height: 120px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    .result-title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .line {
      margin: 12px 0;
      font-size: 20px;
    }

    .small {
      color: #666;
      font-size: 16px;
    }

    .ok {
      color: #177245;
      font-weight: bold;
    }

    .error {
      color: #b42318;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🚌 Calculateur de trajet</h1>

  <div id="status">Chargement des données GTFS...</div>

  <div class="search-bar">
    <input id="from" placeholder="Départ (ex : PUJAUT)" />
    <input id="to" placeholder="Arrivée (ex : REVEL)" />
    <button onclick="findRoute()">Rechercher</button>
  </div>

  <div id="result"></div>

  <script src="scripts.js"></script>
</body>
</html>
