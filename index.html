<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Calculateur de trajet</title>
  <style>
    body {
      font-family: Arial;
      padding: 40px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 40px;
    }

    input {
      padding: 10px;
      width: 250px;
      margin-right: 10px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      background: #2d6cdf;
      color: white;
      border: none;
      cursor: pointer;
    }

    #result {
      margin-top: 30px;
      padding: 20px;
      background: white;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<h1>🚌 Calculateur de trajet</h1>

<input id="from" placeholder="Départ (ex: PUJAUT)">
<input id="to" placeholder="Arrivée (ex: REVEL)">
<button onclick="findRoute()">Rechercher</button>

<div id="result"></div>

<script src="scripts.js"></script>

</body>
</html>
